<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffeef4">
<meta name="color-scheme" content="light">
<title>Chúc mừng 20/10</title>
<meta name="description" content="Một lời chúc 20/10 viết riêng cho từng người.">
<meta property="og:title" content="Chúc mừng 20/10">
<meta property="og:description" content="Nhập họ và tên để mở lời chúc dành riêng cho cậu.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--ink:#7a2e4d;--soft:#b87a93;--accent:#e0678f;--card:rgba(255,255,255,.78);--line:#f6cfdb;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(160deg,#fffafc,#ffe9f0);position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:320px;height:320px;background:#ffc4d6;top:-90px;left:-80px}
.b2{width:280px;height:280px;background:#ffdce8;bottom:-80px;right:-60px}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:max(44px,env(safe-area-inset-top)) 20px max(60px,env(safe-area-inset-bottom));text-align:center}
.flower{width:64px;height:64px;margin:0 auto 6px;display:block;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{letter-spacing:.35em;font-size:12px;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(34px,9vw,48px);line-height:1.15;margin:0 0 10px}
h1 em{color:var(--accent);font-weight:500}
.sub{color:var(--soft);font-weight:300;margin:0 auto 28px;max-width:340px;line-height:1.6;font-size:15px}
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(224,103,143,.15);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:10px 16px;outline:none}
.search input::placeholder{color:#d3a6b8}
.search button,.ghost{font:inherit;cursor:pointer;border:0;border-radius:999px}
.search button{background:linear-gradient(135deg,#f08ab0,#e0678f);color:#fff;padding:10px 22px;font-weight:500;transition:transform .2s}
.search button:active{transform:scale(.95)}
.hint{font-size:12.5px;font-style:italic;color:var(--soft);margin:10px 0 0}
.err{min-height:20px;font-size:13.5px;color:var(--accent);margin:10px 0 0}
#stage{margin-top:22px;perspective:1000px;position:relative;z-index:6}
.wish{--c1:#fff;--c2:#ffe3ec;--tx:#7a2e4d;--ac:#e0678f;position:relative;border-radius:26px;padding:34px 26px 28px;color:var(--tx);background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 20px 50px rgba(224,103,143,.28);border:1px solid rgba(255,255,255,.7);animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both;overflow:hidden}
.wish::before,.wish::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%)}
.wish::before{top:-50px;right:-40px}.wish::after{bottom:-60px;left:-50px}
.wish>*{position:relative;z-index:1}
.wish .to{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin:0 0 6px}
.wish .nm{font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,7.5vw,34px);font-weight:600;margin:0 0 4px}
.wish .full{font-size:13px;opacity:.7;margin:0 0 16px}
.wish .div{width:60px;height:1px;background:var(--ac);margin:0 auto 18px;opacity:.6}
.wish p.txt{font-size:16.5px;line-height:1.75;margin:0;font-weight:300}
.wish .sig{margin-top:20px;font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--ac);font-size:15px}
.ghost{background:rgba(255,255,255,.5);border:1px solid var(--line);color:var(--soft);padding:9px 18px;font-size:13.5px;margin:18px 6px 0}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.92) rotateX(12deg)}to{opacity:1;transform:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<canvas id="fx"></canvas>
<main>
  <svg class="flower" viewBox="0 0 64 64" fill="none" stroke="#e0678f" stroke-width="1.4" aria-hidden="true">
    <g transform="translate(32 32)"><g id="p"><ellipse cx="0" cy="-15" rx="7" ry="13" fill="#ffdbe7"/></g>
    <use href="#p" transform="rotate(72)"/><use href="#p" transform="rotate(144)"/><use href="#p" transform="rotate(216)"/><use href="#p" transform="rotate(288)"/>
    <circle r="5" fill="#fff3c9" stroke="#e8b84f"/></g>
  </svg>
  <p class="eyebrow">20 · 10</p>
  <h1>Chúc mừng <em>ngày của các cậu</em></h1>
  <p class="sub">Có một lời chúc nhỏ được viết riêng cho từng người. Thử tìm xem lời nào là của cậu nhé.</p>
  <div class="search">
    <input id="name" type="text" placeholder="Nhập họ và tên của cậu" autocomplete="off" aria-label="Họ và tên">
    <button id="go">Mở quà</button>
  </div>
  <p class="hint">Cậu nhập cả họ và tên nhé!</p>
  <p class="err" id="err"></p>
  <div id="stage"></div>
</main>

<script>
/* [họ tên, tên gọi, lời chúc, hiệu ứng, bảng màu] */
const W=[
["Phạm Vũ Hòa An","Hòa An","Tớ chúc cậu ngày 20/10 ngập tràn bình yên và hạnh phúc. Mong rằng cuộc sống của cậu luôn trôi qua êm đềm, nhẹ nhàng, luôn giữ được nụ cười an nhiên và tâm hồn rộng mở nhé!",1,4],
["Ngô Ngọc Anh","Ngọc Anh","Tớ chúc cậu luôn rực rỡ và tỏa sáng như một viên ngọc quý. Ngày 20/10 chúc cậu ngày càng xinh đẹp, gặt hái nhiều thành công rực rỡ và luôn giữ được trí tuệ tinh anh, bản lĩnh nhé!",2,4],
["Vũ Quỳnh Anh","Quỳnh Anh","Tớ chúc cậu luôn xinh đẹp, kiêu sa và ngát hương như đóa hoa quỳnh. Mong rằng ngày 20/10 sẽ mang đến cho cậu thật nhiều niềm vui, bất ngờ ngọt ngào và sự thăng hoa trong cuộc sống.",5,0],
["Nguyễn Vũ Huyền Anh","Huyền Anh","Tớ chúc cô nàng bí ẩn và tài năng của tớ một ngày 20/10 thật trọn vẹn. Chúc cậu luôn giữ được nét duyên ngầm cuốn hút, trí tuệ sắc sảo và gặt hái thật nhiều thành tựu lớn!",3,2],
["Vũ Quế Chi","Quế Chi","Tớ chúc cậu luôn giữ được nét thanh tao, sức sống bền bỉ và sự ấm áp. Chúc cậu ngày 20/10 ngập tràn hoa quà, luôn tỏa hương thơm ngát và gặt hái nhiều thành công trong mọi việc!",5,5],
["Phạm Thùy Dương","Thùy Dương","Tớ chúc cậu ngày 20/10 thật ngọt ngào và hạnh phúc. Mong rằng sự dịu dàng của cậu sẽ luôn được trân trọng, cuộc sống luôn bình an và ngập tràn tiếng cười.",1,3],
["Trần Hương Giang","Hương Giang","Tớ chúc cậu mãi dịu dàng, thơ mộng và tràn đầy cảm hứng. Chúc cậu ngày 20/10 ngập tràn yêu thương, luôn giữ được nét đẹp lãng mạn và tâm hồn rộng mở.",4,4],
["Đồng Khánh Huyền","Khánh Huyền","Tớ chúc cậu ngày 20/10 luôn rạng rỡ, tươi vui và gặp nhiều may mắn. Mong rằng nét duyên dáng và sự sâu sắc của cậu sẽ luôn là điểm thu hút tuyệt vời với mọi người xung quanh!",6,1],
["Nguyễn Khánh Linh","Khánh Linh","Tớ chúc cậu luôn tràn đầy năng lượng, tươi vui và gặp nhiều may mắn. Ngày 20/10 chúc cậu nhận được thật nhiều quà, luôn xinh đẹp, trẻ trung và thành công trên con đường mình chọn!",0,3],
["Nguyễn Mai Linh","Mai Linh","Tớ chúc cậu ngày 20/10 tươi trẻ, rạng rỡ như đóa mai vàng mùa xuân. Chúc cậu luôn giữ được sự nhạy bén, thông minh và gặt hái được mọi ước mơ của mình!",5,5],
["Nguyễn Vũ Nhật Linh","Nhật Linh","Tớ chúc cậu luôn tỏa sáng rực rỡ, đem lại năng lượng tích cực cho mọi người. Chúc cậu ngày 20/10 ngập tràn niềm vui, luôn mạnh mẽ và chinh phục mọi đỉnh cao mới!",3,1],
["Phạm Hải Linh","Hải Linh","Tớ chúc cậu ngày 20/10 thật nhiều niềm vui và tự do bay nhảy. Chúc cậu luôn giữ vững bản lĩnh, sự khoáng đạt và gặt hái nhiều thành công to lớn!",4,4],
["Trần Thị Mai Linh","Mai Linh","Tớ chúc cậu luôn tươi tắn, ngọt ngào và tràn đầy sức sống. Ngày 20/10 chúc cậu luôn mỉm cười rạng rỡ, nhận được thật nhiều yêu thương và hạnh phúc đong đầy!",7,0],
["Đỗ Phương Mai","Phương Mai","Tớ chúc cậu ngày 20/10 luôn xinh đẹp, kiêu sa và tỏa hương ngát thơm cho đời. Mong rằng mọi dự định của cậu đều sẽ nở hoa rực rỡ!",5,3],
["Nguyễn Thanh Mai","Thanh Mai","Tớ chúc cậu luôn giữ được nét trong sáng, tươi trẻ và hồn nhiên. Chúc cậu ngày 20/10 thật hạnh phúc, luôn được yêu chiều và gặt hái nhiều thành công ngọt ngào!",1,0],
["Đinh Trà My","Trà My","Tớ chúc cậu luôn xinh đẹp, kiêu hãnh và rực rỡ. Chúc cậu ngày 20/10 ngập tràn hoa quà, luôn giữ được sự sang trọng, quý phái và hạnh phúc viên mãn!",2,2],
["Phạm Trà My","Trà My","Tớ chúc cậu một ngày 20/10 thật ngọt ngào, ngập tràn sắc hoa. Mong rằng cậu sẽ luôn giữ được nét duyên dáng, đài các và cuộc sống luôn trọn vẹn những điều tốt đẹp nhất!",7,3],
["Phạm Thị Ngân","Thị Ngân","Tớ chúc cậu ngày 20/10 thật vui vẻ, tài lộc dồi dào và sung túc. Chúc cậu luôn giữ được sự rạch ròi, bản lĩnh và cuộc sống bình an, viên mãn!",6,5],
["Lê Thị Khánh Ngọc","Khánh Ngọc","Tớ chúc cậu luôn tỏa sáng và quý giá như một viên ngọc. Chúc cậu ngày 20/10 tràn ngập niềm vui, tiếng cười, luôn được bao bọc trong yêu thương và thành công rực rỡ!",2,0],
["Nguyễn Thảo Phương","Thảo Phương","Tớ chúc cậu ngày 20/10 luôn dịu dàng, tràn đầy sức sống và tỏa ngát hương thơm. Chúc cậu luôn giữ được tấm lòng chân thành và hạnh phúc bên những người thân yêu!",5,1],
["Phạm Mai Phương","Mai Phương","Tớ chúc cậu luôn rạng rỡ, kiêu hãnh và vững vàng trên con đường mình đã chọn. Chúc cậu ngày 20/10 ngập tràn niềm vui, hoa quà và luôn giữ được nụ cười tươi tắn trên môi!",3,3],
["Nguyễn Lê Bảo Thanh","Bảo Thanh","Tớ chúc cậu ngày 20/10 luôn được trân trọng và yêu chiều như một báu vật thực thụ. Chúc cậu mãi giữ được sự thanh tao, trí tuệ sắc sảo và gặt hái nhiều thành công lớn!",2,2],
["Đào Minh Thư","Minh Thư","Tớ chúc cô nàng tri thức của tớ một ngày 20/10 thật hạnh phúc và ý nghĩa. Chúc cậu luôn giữ vững phong độ sắc sảo, thông minh, ngày càng xinh đẹp và thành công trong sự nghiệp lẫn cuộc sống!",3,4],
["Nguyễn Thảo Uyên","Thảo Uyên","Tớ chúc cậu ngày 20/10 thật bình yên, tự do và tràn đầy năng lượng tươi mới. Chúc cậu luôn giữ được nụ cười rạng rỡ và cuộc sống luôn ngập tràn sắc màu!",4,0],
["Phan Hà Phương Vy","Phương Vy","Tớ chúc cậu luôn xinh đẹp, quyến rũ và tỏa sáng rực rỡ. Chúc cậu ngày 20/10 nhận được thật nhiều hoa quà, luôn yêu đời và thành công rực rỡ!",0,3]
];
const T=[
["#ffffff","#ffe3ec","#7a2e4d","#e0678f"],
["#fff6f0","#ffd9d0","#7d3a3a","#e9776b"],
["#fbf3ff","#ead9fb","#58337a","#a66ad6"],
["#fff4f8","#ffd0e4","#7a2c55","#d9558f"],
["#f4f8ff","#dbe6fb","#3a4c7a","#6b8fd6"],
["#fffaf0","#ffe8c9","#7a5230","#e0985a"]
];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
const idx=W.map(w=>norm(w[0]));
function find(q){
  q=norm(q); if(!q) return -1;
  let i=idx.indexOf(q); if(i>-1) return i;
  if(q.split(' ').length>=3){const m=idx.map((n,k)=>n.includes(q)?k:-1).filter(k=>k>-1); if(m.length===1) return m[0];}
  return -1;
}
const $=id=>document.getElementById(id);
function show(){
  const q=$('name').value, i=find(q), err=$('err'), st=$('stage');
  if(i<0){st.innerHTML='';err.textContent=norm(q).split(' ').length<2&&q.trim()?'Cậu nhớ nhập cả họ và tên nhé.':'Mình chưa tìm thấy tên này. Cậu kiểm tra lại giúp mình nhé.';return;}
  err.textContent='';
  const w=W[i], t=T[w[4]];
  st.innerHTML='<div class="wish" style="--c1:'+t[0]+';--c2:'+t[1]+';--tx:'+t[2]+';--ac:'+t[3]+'"><p class="to">Gửi riêng cho</p><h2 class="nm">'+w[1]+'</h2><p class="full">'+w[0]+'</p><div class="div"></div><p class="txt">'+w[2]+'</p><p class="sig">Chúc mừng ngày 20/10 ✿</p></div><button class="ghost" id="again">Tìm tên khác</button>';
  $('again').onclick=()=>{st.innerHTML='';$('name').value='';$('name').focus();};
  $('name').blur();
  st.scrollIntoView({behavior:'smooth',block:'center'});
  play(w[3],t[3]);
}
$('go').onclick=show;
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')show();});

/* ===== Hiệu ứng toàn màn hình ===== */
const cv=$('fx'),cx=cv.getContext('2d');
let VW=innerWidth,VH=innerHeight,P=[],emit=null,fr=0,dur=0,run=false;
function fit(){const d=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*d;cv.height=VH*d;cx.setTransform(d,0,0,d,0,0);}
fit();addEventListener('resize',fit);
const R=(a,b)=>a+Math.random()*(b-a);
const PINK=['#f08ab0','#ffb3cb','#ff8fb1','#ffd1df','#e0678f','#ffffff','#ffc2d6'];
const GOLD=['#ffe29a','#ffd36b','#fff3c9','#ffffff'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function add(o){P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,s:10,r:0,vr:0,c:'#f08ab0',k:'heart',l:1,d:.005,sw:0,sp:R(0,6),fr:1,pulse:0,out:1},o));}

const E=[
/* 0 tim bắn lên */ f=>{ if(f===0)for(let i=0;i<70;i++)add({k:i%3?'petal':'heart',x:R(0,VW),y:VH+20,vx:R(-3,3),vy:-R(11,20),g:.3,s:R(9,18),r:R(0,6),vr:R(-.12,.12),c:pick(PINK),d:.006,fr:.992});
  if(f<50)for(let i=0;i<2;i++)add({k:'heart',x:R(0,VW),y:VH+20,vx:R(-2,2),vy:-R(9,17),g:.28,s:R(8,16),r:R(-.4,.4),vr:R(-.05,.05),c:pick(PINK),d:.006}); },
/* 1 cánh hoa rơi */ f=>{ if(f<260&&Math.random()<.7)add({k:'petal',x:R(0,VW),y:-30,vx:R(-.3,.3),vy:R(1.2,3),sw:R(.6,1.6),s:R(8,16),r:R(0,6),vr:R(-.04,.04),c:pick(PINK),d:.0025}); },
/* 2 lấp lánh */ f=>{ if(f<230)for(let i=0;i<2;i++)add({k:'star',x:R(0,VW),y:R(0,VH),s:R(7,20),r:R(0,1),vr:R(-.01,.01),c:pick(GOLD.concat(PINK)),d:R(.012,.02),pulse:1,vy:R(-.2,.2)}); },
/* 3 pháo hoa tim */ f=>{ if(f<210&&f%32===0){const x=R(VW*.12,VW*.88),y=R(VH*.12,VH*.55),c=pick(PINK),n=30;for(let i=0;i<n;i++){const a=i/n*6.283,v=R(3,7);add({k:i%2?'heart':'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.07,s:i%2?R(6,10):R(2,4),r:R(-.5,.5),c:i%4?c:pick(GOLD),d:.012,fr:.965});}} },
/* 4 bong bóng */ f=>{ if(f<260&&Math.random()<.55)add({k:'bubble',x:R(0,VW),y:VH+30,vy:-R(1,3),sw:R(.3,1),s:R(8,34),c:pick(['#ffa8c5','#ffc9dc','#d9b8ff','#ffffff']),d:.0028}); },
/* 5 hoa nở */ f=>{ if(f<200&&f%5===0)add({k:'flower',x:R(30,VW-30),y:R(40,VH-40),s:R(22,58),r:R(0,6),vr:R(-.01,.01),c:pick(['#ffb3cb','#ff8fb1','#ffd1df','#f7a4c3','#ffffff']),d:.008,pulse:1}); },
/* 6 pháo giấy */ f=>{ if(f===0)for(let i=0;i<110;i++){const L=i%2,v=R(13,26),a=R(.25,1.1);add({k:'rect',x:L?0:VW,y:VH,vx:(L?1:-1)*Math.sin(a)*v*.8,vy:-Math.cos(a)*v,g:.35,s:R(6,12),r:R(0,6),vr:R(-.3,.3),c:pick(PINK.concat(GOLD)),d:.005,fr:.985});}
  if(f<80)add({k:'rect',x:R(0,VW),y:-10,vy:R(2,4),sw:R(.5,1.5),s:R(6,11),r:R(0,6),vr:R(-.2,.2),c:pick(PINK.concat(GOLD)),d:.004}); },
/* 7 tim bay lên */ f=>{ if(f<220&&f%7===0)add({k:'heart',x:R(20,VW-20),y:VH+40,vy:-R(1.6,3.2),sw:R(.5,1.4),s:R(18,42),c:pick(PINK.slice(0,5)),d:.0032,r:R(-.3,.3)}); }
];
function play(n,ac){P=[];fr=0;dur=290;emit=E[n];PINK[4]=ac;if(!run){run=true;requestAnimationFrame(tick);}}

function heart(s){cx.beginPath();cx.moveTo(0,s*.35);cx.bezierCurveTo(-s,-s*.4,-s*.5,-s,0,-s*.4);cx.bezierCurveTo(s*.5,-s,s,-s*.4,0,s*.35);cx.closePath();}
function star(s){cx.beginPath();cx.moveTo(0,-s);cx.quadraticCurveTo(0,0,s,0);cx.quadraticCurveTo(0,0,0,s);cx.quadraticCurveTo(0,0,-s,0);cx.quadraticCurveTo(0,0,0,-s);cx.closePath();}
function tick(){
  cx.clearRect(0,0,VW,VH);
  if(fr<dur&&emit)emit(fr);
  fr++;
  P=P.filter(p=>p.l>0&&p.y<VH+80&&p.y>-120&&p.x>-120&&p.x<VW+120);
  for(const p of P){
    p.vy+=p.g;p.vx*=p.fr;if(p.fr<1)p.vy*=p.fr;
    p.sp+=.04;p.x+=p.vx+Math.sin(p.sp)*p.sw;p.y+=p.vy;p.r+=p.vr;p.l-=p.d;
    const a=p.pulse?Math.sin(Math.PI*(1-Math.max(p.l,0))):Math.min(1,p.l*3);
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,Math.min(1,a));cx.fillStyle=p.c;
    const s=p.s;
    if(p.k==='heart'){heart(s);cx.fill();}
    else if(p.k==='petal'){cx.beginPath();cx.ellipse(0,0,s*.45,s,0,0,7);cx.fill();}
    else if(p.k==='dot'){cx.beginPath();cx.arc(0,0,s,0,7);cx.fill();}
    else if(p.k==='star'){star(s);cx.fill();cx.rotate(.785);star(s*.55);cx.fill();}
    else if(p.k==='rect'){cx.fillRect(-s/2,-s/4,s,s/2);}
    else if(p.k==='bubble'){cx.globalAlpha*=.75;cx.strokeStyle=p.c;cx.lineWidth=1.6;cx.beginPath();cx.arc(0,0,s,0,7);cx.stroke();cx.globalAlpha*=.25;cx.fill();cx.globalAlpha=Math.max(0,a)*.8;cx.fillStyle='#fff';cx.beginPath();cx.arc(-s*.35,-s*.35,s*.18,0,7);cx.fill();}
    else if(p.k==='flower'){const g=Math.min(1,(1-p.l)*6),z=s*g;for(let i=0;i<5;i++){cx.rotate(1.2566);cx.beginPath();cx.ellipse(0,-z*.55,z*.3,z*.55,0,0,7);cx.fill();}cx.fillStyle='#ffe29a';cx.beginPath();cx.arc(0,0,z*.2,0,7);cx.fill();}
    cx.restore();
  }
  if(P.length||fr<dur)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,VW,VH);}
}
